name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          PLATFORM="$SDK/platforms/android-36"
          BUILD_TOOLS="$SDK/build-tools/36.0.0"
          if [ ! -d "$PLATFORM" ] || [ ! -d "$BUILD_TOOLS" ]; then
            SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
            echo "sdkmanager=$SDKM"
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses > /dev/null || true
              [ -d "$PLATFORM" ] || "$SDKM" "platforms;android-36" || true
              [ -d "$BUILD_TOOLS" ] || "$SDKM" "build-tools;36.0.0" || true
            fi
          fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync into Android project
        run: pnpm exec cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: change-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
